name: CI Workflow

on:
   push:
      branches:
        - main

jobs:
   build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        run: make build
        
   code-coverage:
	 runs-on: ubuntu-latest
    needs: build
	 steps:
     - name: Checkout repository
		uses: actions/checkout@v4
  
     - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle
   
     - name: start JaCoCo tests
      run: ./gradlew test jacocoTestReport
   
     - name: Send report to Code Climate
      run: |
        bash <(curl -s https://codeclimate.com/downloads/test-reporter/test-reporter.latest.sh)
        ./cc-test-reporter before-build
        ./cc-test-reporter format-coverage build/reports/jacoco/test/jacocoTestReport.xml --input-type jacoco
        ./cc-test-reporter upload-coverage
      env:
        CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
